# Spike demo: every block below should raise a diagnostic with haproxy.version = 3.2
global
    daemon
    maxconn 20000
    shm-stats-file /var/run/haproxy.stats

defaults
    mode http
    timeout connect 5
    timeout client 30s
    timeout server 30s

frontend public
    bind *:99999
    use_backend mobile-backend if { path_beg /mobile }
    default_backend app-backend

backend app-backend
    balance roundrobin
    server app1 10.0.0.1:8080 check
