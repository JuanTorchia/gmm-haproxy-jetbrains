# Demo configuration. Several lines are intentionally wrong for HAProxy 3.2.
global
    daemon
    maxconn 20000
    log stdout format raw local0
    shm-stats-file /var/run/haproxy.stats

defaults
    mode http
    log global
    option httplog
    timeout connect 5
    timeout client 30s
    timeout server 30s

frontend public
    bind *:80
    bind *:99999
    acl is_api path_beg /api
    use_backend api-servers if is_api
    use_backend mobile-backend if { path_beg /mobile }
    default_backend web-servers

backend web-servers
    balance roundrobin
    option httpchk GET /health
    server web1 10.0.0.11:8080 check
    server web2 10.0.0.12:8080 check

backend api-servers
    balance leastconn
    server api1 10.0.0.21:9000 check
