name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: '24 9 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile for CodeQL
        run: |
          chmod +x gradlew
          ./gradlew compileKotlin compileTestKotlin --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4
