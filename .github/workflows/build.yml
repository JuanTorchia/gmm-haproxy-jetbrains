name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the Plugin Verifier IDEs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build, test and verify
        run: |
          chmod +x gradlew
          ./gradlew build buildPlugin verifyPlugin --no-daemon

      - name: Resolve exact dependency inventory
        run: ./gradlew --init-script scripts/security/inventory.init.gradle securityInventory --no-daemon

      - name: Verify scanner contract and query OSV
        run: |
          python3 scripts/security/inventory_package.py
          python3 -m unittest discover -s scripts/security -p 'test_*.py'
          python3 scripts/security/scan_osv.py

      - name: Retain dependency security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-dependency-security
          path: |
            build/security/*.json
            build/distributions/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-zip
          path: build/distributions/*.zip
