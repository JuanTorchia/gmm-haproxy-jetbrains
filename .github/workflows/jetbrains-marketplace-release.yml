name: JetBrains Marketplace Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: jetbrains-marketplace-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    environment: jetbrains-marketplace
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z-suffix. Got: $tag" >&2
            exit 1
          fi
          echo "PLUGIN_VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Free disk space for the Plugin Verifier IDEs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # No shared Gradle cache in the job that holds the signing and publishing secrets.
          cache-disabled: true

      - name: Validate release candidate
        run: |
          chmod +x gradlew
          ./gradlew build verifyPlugin --no-daemon --stacktrace -PpluginVersion=$PLUGIN_VERSION

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          ./gradlew publishPlugin --no-daemon --stacktrace -PpluginVersion=$PLUGIN_VERSION

      - name: Attach plugin ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" build/distributions/*.zip --clobber
